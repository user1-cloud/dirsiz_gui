<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DirSiz — Directory Size Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Synthwave sky gradient -->
    <div class="sky-gradient"></div>

    <!-- Outrun grid floor -->
    <canvas id="outrunGrid"></canvas>

    <!-- Scanline overlay -->
    <div class="scanlines"></div>

    <div id="app">
      <!-- Top bar: logo left, path right -->
      <header class="topbar">
        <div class="logo">
          <span class="logo-mark">&#9670;</span>
          <span class="logo-text">DIRSIZ</span>
          <span class="logo-version-outer"><span class="logo-version">v1.0</span></span>
        </div>

        <div class="path-bar">
          <div class="path-input-anchor">
            <div class="path-input-outer">
              <div class="path-input-wrapper">
                <span class="path-prompt">&#9654;</span>
                <input
                  id="pathInput"
                  type="text"
                  class="path-input"
                  data-i18n-placeholder="placeholder"
                  placeholder="target directory ..."
                  autocomplete="off"
                  spellcheck="false"
                />
              </div>
            </div>
          </div>
          <div class="btn-scan-outer">
            <button id="scanBtn" class="btn-scan">
              <span class="btn-label" data-i18n="scan">INIT SCAN</span>
              <span class="btn-shimmer"></span>
            </button>
          </div>
        </div>
      </header>

      <!-- Sub bar -->
      <div class="subbar">
        <div class="controls-row">
          <label class="toggle-label">
            <input type="checkbox" id="showHidden" />
            <span class="toggle-track"></span>
            <span class="toggle-text" data-i18n="hidden">hidden</span>
          </label>
          <button id="collapseAll" class="btn-ghost" data-i18n="foldAll">fold all</button>
          <button id="fontToggle" class="btn-ghost" title="Toggle font">font</button>
          <button id="langToggle" class="btn-ghost" title="Switch language">中 / EN</button>
          <div id="statsBar" class="stats-inline hidden">
            <span class="stat-inline"><span class="stat-label" data-i18n="statVol">VOL</span><span id="statSize" class="stat-value">—</span></span>
            <span class="stat-sep"></span>
            <span class="stat-inline"><span class="stat-label" data-i18n="statFiles">FILES</span><span id="statFiles" class="stat-value">—</span></span>
            <span class="stat-sep"></span>
            <span class="stat-inline"><span class="stat-label" data-i18n="statDirs">DIRS</span><span id="statDirs" class="stat-value">—</span></span>
            <span class="stat-sep"></span>
            <span class="stat-inline"><span class="stat-label" data-i18n="statTime">TIME</span><span id="statTime" class="stat-value">—</span></span>
          </div>
        </div>
      </div>

      <!-- Tree container -->
      <div class="tree-outer">
        <div id="treeContainer" class="tree-container">
        <div id="loadingIndicator" class="loading hidden">
          <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-core"></div>
          </div>
          <span class="loading-text" data-i18n="scanning">scanning sectors<span class="loading-dots"></span></span>
        </div>
        <div id="emptyState" class="empty-state">
          <div class="empty-mark">&#9678;</div>
          <div class="empty-text" data-i18n="emptyText">enter a target path and initialize scan</div>
          <div class="empty-hint" data-i18n="emptyHint">press <kbd>ENTER</kbd> or click INIT SCAN</div>
        </div>
        <div id="treeContent" class="tree-content"></div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <span id="footerText" class="footer-text" data-i18n="footerReady">READY</span>
        <span class="footer-blink">&#9632;</span>
        <span id="footerProgress" class="footer-progress"></span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
