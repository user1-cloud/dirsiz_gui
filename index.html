<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DirSiz — Directory Size Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Synthwave sky gradient -->
    <div class="sky-gradient"></div>

    <!-- Outrun grid floor -->
    <canvas id="outrunGrid"></canvas>

    <!-- Scanline overlay -->
    <div class="scanlines"></div>

    <div id="app">
      <!-- Top bar: logo left, path right -->
      <header class="topbar">
        <div class="logo">
          <span class="logo-mark">&#9670;</span>
          <span class="logo-text">DIRSIZ</span>
          <span class="logo-version">v1.0</span>
        </div>

        <div class="path-input-wrapper">
          <span class="path-prompt">&#9654;</span>
          <input
            id="pathInput"
            type="text"
            class="path-input"
            placeholder="target directory ..."
            spellcheck="false"
          />
          <button id="scanBtn" class="btn-scan">
            <span class="btn-label">INIT SCAN</span>
            <span class="btn-shimmer"></span>
          </button>
        </div>
      </header>

      <!-- Sub bar -->
      <div class="subbar">
        <div class="controls-row">
          <label class="toggle-label">
            <input type="checkbox" id="showHidden" />
            <span class="toggle-track"></span>
            <span class="toggle-text">hidden</span>
          </label>
          <button id="collapseAll" class="btn-ghost">fold all</button>
          <button id="expandAll" class="btn-ghost">unfold all</button>
        </div>
        <span class="subbar-label">DISK ANALYZER</span>
      </div>

      <!-- Stats bar -->
      <div id="statsBar" class="stats-bar hidden">
        <div class="stat">
          <span class="stat-label">VOLUME</span>
          <span id="statSize" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">FILES</span>
          <span id="statFiles" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">DIRS</span>
          <span id="statDirs" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">ELAPSED</span>
          <span id="statTime" class="stat-value">—</span>
        </div>
      </div>

      <!-- Tree container -->
      <div id="treeContainer" class="tree-container">
        <div id="loadingIndicator" class="loading hidden">
          <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-core"></div>
          </div>
          <span class="loading-text">scanning sectors<span class="loading-dots"></span></span>
        </div>
        <div id="emptyState" class="empty-state">
          <div class="empty-mark">&#9678;</div>
          <div class="empty-text">enter a target path and initialize scan</div>
          <div class="empty-hint">press <kbd>ENTER</kbd> or click INIT SCAN</div>
        </div>
        <div id="treeContent" class="tree-content"></div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <span class="footer-text">READY</span>
        <span class="footer-blink">&#9632;</span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
